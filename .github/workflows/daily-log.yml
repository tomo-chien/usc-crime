name: Run daily-log every 10 minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # <-- allow push with GITHUB_TOKEN

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # we need full history to commit cleanly

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater
        run: python scripts/daily-log.py

      - name: Generate chart data
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DATAWRAPPER_CHART_MOSTCOMMON: ${{ secrets.DATAWRAPPER_CHART_MOSTCOMMON }}
          DATAWRAPPER_CHART_BIKETHEFTS: ${{ secrets.DATAWRAPPER_CHART_BIKETHEFTS }}
          DATAWRAPPER_CHART_PARTIES: ${{ secrets.DATAWRAPPER_CHART_PARTIES }}
          DATAWRAPPER_CHART_YOYTREND: ${{ secrets.DATAWRAPPER_CHART_YOYTREND }}
        run: |
          python scripts/generateChartData.py

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push if changed
        run: |
          # Limit to the files your script updates to avoid committing noise
          git add data/usc_crime_logs.csv data/usc_crime_logs.json data/*.csv data/headlines.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update logs and chart data [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
